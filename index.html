<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NKI Imagen v4.3 - Google Gemini Standalone Studio</title>
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="description" content="NKI Studio v4.3 - Google Gemini Standalone Studio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NKI v4.3" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: 'var(--primary-50)',
                100: 'var(--primary-100)',
                200: 'var(--primary-200)',
                300: 'var(--primary-300)',
                400: 'var(--primary-400)',
                500: 'var(--primary-500)',
                600: 'var(--primary-600)',
                700: 'var(--primary-700)',
                800: 'var(--primary-800)',
                900: 'var(--primary-900)',
                950: 'var(--primary-950)',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-50: #ecfdf5;
        --primary-100: #d1fae5;
        --primary-200: #a7f3d0;
        --primary-300: #6ee7b7;
        --primary-400: #34d399;
        --primary-500: #10b981;
        --primary-600: #059669;
        --primary-700: #047857;
        --primary-800: #065f46;
        --primary-900: #064e3b;
        --primary-950: #022c22;
        --bg-color-1: #131c2e;
        --bg-color-2: #0a0f1a;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(ellipse at 50% 0%, var(--bg-color-1), var(--bg-color-2));
        background-color: #0a0f1a;
        background-attachment: fixed;
        min-height: 100vh;
        color: var(--text-color, #f1f5f9);
        margin: 0;
        transition: background 0.8s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s ease;
      }

      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(var(--primary-500-rgb, 148, 163, 184), 0.2); border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(var(--primary-500-rgb, 148, 163, 184), 0.4); }
      
      .glass-card {
        background: var(--glass-bg, rgba(255, 255, 255, 0.03));
        backdrop-filter: blur(28px) saturate(180%);
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.12));
        box-shadow: 
          0 4px 6px -1px rgba(0, 0, 0, 0.02),
          0 16px 40px -8px rgba(0, 0, 0, 0.25),
          inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.15);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease;
      }

      .glass-input {
        background: var(--input-bg, rgba(255, 255, 255, 0.04));
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.12));
        color: var(--text-color, white);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.03);
      }

      .glass-input:focus {
        background: var(--input-bg, rgba(255, 255, 255, 0.08));
        border-color: var(--primary-400);
        box-shadow: 
          inset 0 1px 2px 0 rgba(255, 255, 255, 0.25),
          0 0 0 4px rgba(var(--primary-500-rgb, 16, 185, 129), 0.2),
          0 8px 24px -4px rgba(var(--primary-500-rgb, 16, 185, 129), 0.2);
        outline: none;
      }

      @keyframes floatSlow {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(45px, -35px) scale(1.08); }
        100% { transform: translate(-25px, 25px) scale(0.96); }
      }

      @keyframes floatReverse {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-40px, 40px) scale(1.06); }
        100% { transform: translate(30px, -30px) scale(0.95); }
      }

      @keyframes neural-glow {
        0% { opacity: 0.25; }
        50% { opacity: 0.45; }
        100% { opacity: 0.25; }
      }

      @keyframes galleryStaggeredFadeIn {
        0% {
          opacity: 0;
          transform: translateY(28px) scale(0.95);
          filter: blur(10px);
        }
        60% {
          opacity: 0.95;
          filter: blur(1px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0px);
        }
      }

      @keyframes imageRenderReveal {
        0% {
          opacity: 0;
          transform: scale(1.08);
          filter: blur(14px) brightness(1.15);
        }
        50% {
          opacity: 0.85;
          filter: blur(4px) brightness(1.05);
        }
        100% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0px) brightness(1);
        }
      }

      .staggered-gallery-card {
        animation: galleryStaggeredFadeIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .image-render-reveal {
        animation: imageRenderReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .neural-accent {
        position: fixed;
        border-radius: 50%;
        background: radial-gradient(circle, var(--primary-500), transparent 70%);
        filter: blur(100px);
        z-index: -1;
        pointer-events: none;
        transition: opacity 0.8s ease;
      }

      .neural-accent-1 {
        top: -10%;
        left: -8%;
        width: 55vw;
        height: 55vw;
        animation: floatSlow 22s infinite ease-in-out alternate;
        opacity: 0.12;
      }

      .neural-accent-2 {
        bottom: -15%;
        right: -10%;
        width: 50vw;
        height: 50vw;
        animation: floatReverse 26s infinite ease-in-out alternate;
        animation-delay: -7s;
        opacity: 0.10;
      }

      .neural-accent-3 {
        top: 35%;
        right: 15%;
        width: 38vw;
        height: 38vw;
        animation: floatSlow 18s infinite ease-in-out alternate;
        animation-delay: -12s;
        opacity: 0.08;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div class="neural-accent neural-accent-1"></div>
    <div class="neural-accent neural-accent-2"></div>
    <div class="neural-accent neural-accent-3"></div>
    <div id="root"></div>
    <script id="google-gsi-client" src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
